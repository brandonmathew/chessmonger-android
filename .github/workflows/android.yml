name: Android CI

# v2.0.0: first CI run validates the new Gradle setup.
# Core tests (pure Java, no Android SDK) run as a separate
# job so they pass even if the Android job needs SDK fixes.
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Compile core and run JUnit tests (no Gradle)
        run: |
          mkdir -p /tmp/core-classes /tmp/test-classes
          javac -encoding UTF-8 -source 8 -target 8 -d /tmp/core-classes \
            app/src/main/java/com/chessmonger/core/*.java
          # JUnit 4.13.2, downloaded from Maven Central (no Gradle needed for this job)
          curl -Ls https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar -o /tmp/junit.jar
          curl -Ls https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar -o /tmp/hamcrest.jar
          javac -encoding UTF-8 -source 8 -target 8 \
            -cp /tmp/core-classes:/tmp/junit.jar:/tmp/hamcrest.jar \
            -d /tmp/test-classes app/src/test/java/com/chessmonger/core/*.java
          java -cp /tmp/core-classes:/tmp/test-classes:/tmp/junit.jar:/tmp/hamcrest.jar \
            org.junit.runner.JUnitCore \
            com.chessmonger.core.ChessBoardTest \
            com.chessmonger.core.DetectorCoreTest \
            com.chessmonger.core.TrackerTest

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Build debug APK with Gradle
        run: ./gradlew :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ChessMonger-debug-apk
          path: app/build/outputs/apk/debug/*.apk
